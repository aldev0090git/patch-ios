name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to the same branch cancels the previous run. macOS runners bill at
# a 10x minute multiplier, so not paying for superseded runs matters.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: PatchCore
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: Packages/PatchKit/.build
          key: spm-${{ runner.os }}-${{ hashFiles('Packages/PatchKit/Package.swift') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Build
        working-directory: Packages/PatchKit
        run: swift build

      - name: Test
        working-directory: Packages/PatchKit
        run: swift test

  app:
    name: Patch (iOS)
    # Xcode 27 image (public preview, arm64 only). Keeps CI on the same major
    # Xcode as local development, so a failure here means a real problem rather
    # than a version gap.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4

      # Use the image's own default Xcode. Picking the "newest" installed one
      # selects a beta on this image, which would fail builds on beta bugs
      # rather than on anything in this repo.
      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build for simulator
        run: |
          xcodebuild -project Patch/Patch.xcodeproj -scheme Patch \
            -destination 'generic/platform=iOS Simulator' \
            -quiet build

  lint:
    name: SwiftLint
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: Lint
        run: swiftlint lint --strict --reporter github-actions-logging

      # Xcode occasionally offers to "upgrade" the project format. Accepting
      # would bump objectVersion to 110 and lock the repo to Xcode 27, which
      # defeats the point of committing the .xcodeproj at all.
      - name: Project stays openable in older Xcode
        run: |
          version=$(grep -o 'objectVersion = [0-9]*' Patch/Patch.xcodeproj/project.pbxproj | head -1 | grep -o '[0-9]*')
          echo "objectVersion = $version"
          if [ "$version" != "77" ]; then
            echo "::error::Project format changed to $version; expected 77 so the project opens in Xcode 16+."
            exit 1
          fi
