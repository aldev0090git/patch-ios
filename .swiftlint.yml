# Deliberately close to the community default. A lint config that disables
# every rule it trips over is worse than no lint config at all.

included:
  - Patch
  - Packages

excluded:
  - "**/.build"
  - "**/DerivedData"
  - "**/*.xcodeproj"

opt_in_rules:
  - empty_count
  - explicit_init
  - first_where
  - last_where
  - force_unwrapping
  - implicitly_unwrapped_optional
  - literal_expression_end_indentation
  - multiline_parameters
  - operator_usage_whitespace
  - overridden_super_call
  - redundant_nil_coalescing
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - yoda_condition

line_length:
  warning: 120
  error: 160
  ignores_comments: true

type_body_length:
  warning: 300
  error: 400

file_length:
  warning: 450
  error: 600

function_body_length:
  warning: 50
  error: 80

identifier_name:
  min_length:
    warning: 2
  excluded: [id, x, y, i]

# Tests legitimately force-unwrap fixtures and run long.
force_unwrapping:
  severity: warning
